# /usr/lib/sysctl.d/zz-arxos-net.conf — ARXOS network tuning.
# Three goals, all safe as always-on defaults: saturate fast links (up + down), sustain
# wide port scans without table overflow, and give socket-heavy tools (fuzzers) headroom.
# Shipped with linux-arxos, applied live by its install.sh (no reboot, no reinstall).

# --- throughput: BBR + fair-queue + large buffers for high bandwidth-delay-product links ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 65536
net.ipv4.tcp_rmem = 4096 1048576 134217728
net.ipv4.tcp_wmem = 4096 1048576 134217728
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_slow_start_after_idle = 0
net.core.netdev_max_backlog = 65536
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000

# --- wide scans: more ephemeral ports, fast socket turnover, bigger neighbour tables ---
# (large local-subnet sweeps otherwise hit "neighbour table overflow" and stall.)
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_max_syn_backlog = 65536
net.ipv4.tcp_max_tw_buckets = 2000000
net.core.somaxconn = 65535
net.ipv4.neigh.default.gc_thresh1 = 4096
net.ipv4.neigh.default.gc_thresh2 = 8192
net.ipv4.neigh.default.gc_thresh3 = 16384
net.ipv6.neigh.default.gc_thresh1 = 4096
net.ipv6.neigh.default.gc_thresh2 = 8192
net.ipv6.neigh.default.gc_thresh3 = 16384

# --- socket/fuzzing headroom: raises ceilings only, changes no runtime behaviour ---
fs.file-max = 2097152
fs.nr_open = 2097152
kernel.pid_max = 4194304
vm.max_map_count = 1048576
