# /usr/lib/sysctl.d/zz-arxos-io.conf — ARXOS I/O tuning for the arx package/build workload.
# arx (and pacman under it) does bursts of many small extract-writes + large DB reads.
# Bigger writeback windows let those batch instead of stalling on frequent flushes; a lower
# cache-pressure keeps the package DB dentries/inodes hot across back-to-back queries.
# Shipped with linux-arxos and applied live by its install.sh (no reboot, no reinstall).
vm.dirty_background_ratio = 10
vm.dirty_ratio = 30
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 1500
vm.vfs_cache_pressure = 50
