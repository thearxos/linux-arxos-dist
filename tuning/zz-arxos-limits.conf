# /etc/security/limits.d/60-arxos-limits.conf — high fd/proc ceilings for scanners + fuzzers.
# masscan/zmap/nmap open thousands of sockets at once; fuzzers spawn many short-lived procs.
# PAM logins (terminal, ssh, the display manager) pick these up via pam_limits.
*      soft nofile 1048576
*      hard nofile 1048576
*      soft nproc  256000
*      hard nproc  256000
root   soft nofile 1048576
root   hard nofile 1048576
